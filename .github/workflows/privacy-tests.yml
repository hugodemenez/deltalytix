name: Privacy tests

on:
  pull_request:
  push:
    branches:
      - beta

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run privacy and related unit tests
        run: |
          bunx vitest run \
            'app/[locale]/(landing)/privacy/privacy-copy.test.ts' \
            'lib/consent-persist.test.ts' \
            'lib/account-deleted-notice.test.ts' \
            'lib/account-deletion-result.test.ts' \
            'lib/stripe-secret.test.ts' \
            'components/google-tag.test.ts' \
            'components/account-deleted-notice.test.tsx' \
            'server/account-deletion/trade-rows.test.ts' \
            'server/account-deletion/storage.test.ts' \
            'server/account-deletion/id-format.test.ts' \
            'server/account-deletion/pending-cleanup.test.ts' \
            'server/account-deletion/pending-cleanup-guard.test.ts' \
            'server/account-deletion/live-subscription.test.ts' \
            'server/account-deletion/supabase-auth.test.ts' \
            'server/account-deletion/stripe.test.ts' \
            'server/delete-account.test.ts' \
            'app/api/admin/pending-account-cleanup/route.test.ts'
