name: Rithmic Protocol e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/rithmic-protocol/**"
      - ".github/workflows/rithmic-protocol-e2e.yml"
      - "vitest.e2e.config.ts"
      - "package.json"
  push:
    branches:
      - beta
    paths:
      - "lib/rithmic-protocol/**"
      - ".github/workflows/rithmic-protocol-e2e.yml"
      - "vitest.e2e.config.ts"
      - "package.json"

# One live login at a time. Do not cancel in-flight jobs — a killed WebSocket
# can leave the test user session dangling on the plant.
concurrency:
  group: rithmic-protocol-e2e
  cancel-in-progress: false

jobs:
  product-rms:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Product RMS proto (no credentials)
        run: bunx vitest run lib/rithmic-protocol/product-rms-proto.test.ts lib/rithmic-protocol/commission-rates.test.ts lib/rithmic-protocol/fills-to-trades.test.ts

      - name: Live Product RMS e2e
        env:
          RITHMIC_PROTOCOL_E2E_USERNAME: ${{ secrets.RITHMIC_PROTOCOL_E2E_USERNAME }}
          RITHMIC_PROTOCOL_E2E_PASSWORD: ${{ secrets.RITHMIC_PROTOCOL_E2E_PASSWORD }}
          RITHMIC_PROTOCOL_E2E_SYSTEM_NAME: ${{ vars.RITHMIC_PROTOCOL_E2E_SYSTEM_NAME || 'Rithmic Test' }}
          RITHMIC_PROTOCOL_E2E_GATEWAY: ${{ vars.RITHMIC_PROTOCOL_E2E_GATEWAY || 'test' }}
        run: |
          if [ -z "$RITHMIC_PROTOCOL_E2E_USERNAME" ] || [ -z "$RITHMIC_PROTOCOL_E2E_PASSWORD" ]; then
            echo "Skipping live gateway: set Actions secrets RITHMIC_PROTOCOL_E2E_USERNAME and RITHMIC_PROTOCOL_E2E_PASSWORD."
            echo "Optional repository variables: RITHMIC_PROTOCOL_E2E_SYSTEM_NAME (default Rithmic Test), RITHMIC_PROTOCOL_E2E_GATEWAY (default test)."
            exit 0
          fi
          bun run test:e2e:rithmic
